spring.application.name=sartoria-digitale-backend
spring.config.import=optional:file:env.properties
# server config
server.port=${PORT}
# db config
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# hibernate
spring.jpa.hibernate.ddl-auto=update
# secret
jwt.secret=${JWT_SECRET}
#cloudinary
CLOUDINARY_URL=cloudinary://${CLOUDINARY_APIKEY}:${CLOUDINARY_SECRET}@sejcn1v6
cloudinary.name=${CLOUDINARY_NAME}
cloudinary.api.secret=${CLOUDINARY_SECRET}
cloudinary.api.key=${CLOUDINARY_APIKEY}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
spring.data.web.pageable.serialization-mode=via_dto
#accesso super admin
superadmin.email=${SUPERADMIN_EMAIL}
superadmin.password=${SUPERADMIN_PASSWORD}
# Mailgun config
mailgun.apikey=${MAILGUN_API_KEY}
mailgun.domainname=${MAILGUN_DOMAIN_NAME}